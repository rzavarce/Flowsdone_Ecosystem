# Rutas estáticas de Traefik — file provider
# Actualizá los dominios acá si cambian (no toman variables de .env)
# Traefik las recarga solo (--providers.file.watch=true sobre la carpeta ./traefik, que
# se monta entera para que vea los reemplazos que hace `git pull`). No hace falta reiniciarlo.

http:
  middlewares:
    webchat-static:
      replacePathRegex:
        regex: "^/(.*)"
        replacement: "/static/webchat/$1"

    flowsdone-static:
      replacePathRegex:
        regex: "^/(.*)"
        replacement: "/static/flowsdone/$1"

    # Una sola dirección para la landing: www.flowsdone.com -> flowsdone.com
    # (301, conserva la ruta). Es la URL canónica que declara la página.
    flowsdone-www-redirect:
      redirectRegex:
        regex: "^https?://www\\.flowsdone\\.com/(.*)"
        replacement: "https://flowsdone.com/${1}"
        permanent: true

    # Consola web (PWA). HSTS se pone acá porque es Traefik quien termina TLS
    # (el nginx del contenedor solo ve http). SIN includeSubdomains a propósito:
    # los demás subdominios (webchat, langfuse…) tienen su propio ciclo de vida
    # y no deberían quedar forzados a https por esta ruta.
    pwa-security:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: false
        stsPreload: false
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"

  routers:
    n8n:
      rule: "Host(`auto.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: n8n-svc

    langfuse:
      rule: "Host(`langfuse.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: langfuse-svc

    langflow:
      rule: "Host(`agents.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: langflow-svc

    # Cierre del inicio de sesión único del editor embebido: el gateway canjea el
    # ticket, entra a Langflow como el usuario del tenant y pone las cookies EN ESTE
    # host (por eso pasa por agents., no por platform.). Prioridad mayor que el
    # router `langflow` para ganarle en esta ruta exacta.
    langflow-sso:
      rule: "Host(`agents.flowsdone.com`) && Path(`/langflow-sso`)"
      priority: 100
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc

    evolution:
      rule: "Host(`evo.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: evolution-svc

    # Los routers *-ws van SIN el middleware de reescritura de path: si no,
    # replacePathRegex convierte /ws en /static/<sitio>/ws y el websocket
    # del chat nunca llega al gateway. Las reglas son mutuamente excluyentes
    # (!Path(`/ws`) en el router estático) en vez de depender de priority,
    # para que no haya ambigüedad de cuál router gana.
    webchat-ws:
      rule: "Host(`chat.flowsdone.com`) && Path(`/ws`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc

    webchat:
      rule: "Host(`chat.flowsdone.com`) && !Path(`/ws`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc
      middlewares:
        - webchat-static

    # platform.flowsdone.com: mismo backend que chat.flowsdone.com
    # (webchat-svc = api:8000), pero SIN el middleware de reescritura — acá
    # sí llegan /internal/admin/*, /webhooks/* y /ws sin modificar.
    # chat.flowsdone.com queda exclusivamente para servir el estático del
    # widget de demo (más su propio /ws, que necesita same-origin para
    # funcionar en la demo).
    platform:
      rule: "Host(`platform.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc

    flowsdone-ws:
      rule: "(Host(`flowsdone.com`) || Host(`www.flowsdone.com`)) && Path(`/ws`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc

    # Formulario de contacto de la landing: va al gateway SIN la reescritura a
    # /static/flowsdone (router `flowsdone`), de ahí la prioridad explícita.
    flowsdone-contact:
      rule: "(Host(`flowsdone.com`) || Host(`www.flowsdone.com`)) && Path(`/public/contact`)"
      priority: 200
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc

    flowsdone:
      rule: "(Host(`flowsdone.com`) || Host(`www.flowsdone.com`)) && !Path(`/ws`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc
      middlewares:
        - flowsdone-www-redirect
        - flowsdone-static

    # Metabase (dashboards y reportes). El navegador carga de aquí los
    # dashboards embebidos en la consola (/embed/..., URLs firmadas por el
    # gateway); el resto es la interfaz de Metabase, con su propio login.
    # Requiere un registro DNS `bi` -> IP del VPS.
    metabase:
      rule: "Host(`bi.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: metabase-svc

    # Consola web (PWA React servida por nginx dentro del contenedor `pwa`).
    # Mismo origen para la SPA y su API: nginx reenvía /api/auth/* al gateway,
    # por eso NO hace falta CORS y la cookie de sesión (httpOnly, host-only)
    # queda aislada en este host. Requiere un registro DNS `app` -> IP del VPS
    # ANTES del deploy, o el challenge HTTP-01 de Let's Encrypt fallará.
    pwa:
      rule: "Host(`app.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: pwa-svc
      middlewares:
        - pwa-security

    minio:
      rule: "Host(`buckets.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: minio-svc

    redisinsight:
      rule: "Host(`cache.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: redisinsight-svc

    rabbitui:
      rule: "Host(`broker.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: rabbitui-svc

    weaviate:
      rule: "Host(`vector.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: weaviate-svc

    logs:
      rule: "Host(`logs.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: logs-svc

  services:
    n8n-svc:
      loadBalancer:
        servers:
          - url: "http://n8n:5678"

    langfuse-svc:
      loadBalancer:
        servers:
          - url: "http://langfuse-web:3000"

    langflow-svc:
      loadBalancer:
        servers:
          - url: "http://langflow:7860"

    evolution-svc:
      loadBalancer:
        servers:
          - url: "http://evolution:8080"

    # El webchat se sirve como estático desde el propio gateway (api),
    # no hay un servicio webchat-gateway separado en este proyecto.
    webchat-svc:
      loadBalancer:
        servers:
          - url: "http://api:8000"

    metabase-svc:
      loadBalancer:
        servers:
          - url: "http://metabase:3000"

    pwa-svc:
      loadBalancer:
        servers:
          - url: "http://pwa:80"

    minio-svc:
      loadBalancer:
        servers:
          - url: "http://minio:9001"

    redisinsight-svc:
      loadBalancer:
        servers:
          - url: "http://redis-insight:5540"

    rabbitui-svc:
      loadBalancer:
        servers:
          - url: "http://rabbitmq-scout:3000"

    weaviate-svc:
      loadBalancer:
        servers:
          - url: "http://weaviate-gui:8501"

    logs-svc:
      loadBalancer:
        servers:
          - url: "http://opensearch-dashboards:5601"
