name: ${COMPOSE_PROJECT_NAME}

x-common: &common
  restart: always
  profiles: [dev, prod]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
      # El otel-collector (filelog/docker) lee esta label para poder rutear
      # cada log al índice de OpenSearch de su propio servicio.
      labels: "com.docker.compose.service"

networks:
  flowsdone-net:
    driver: bridge

volumes:
  # postgres_data:
  redis_data:
  redisinsight_data:
  clickhouse_data:
  clickhouse_logs:
  opensearch_data:
  n8n_data:


services:

  # ------------------------------------------------------------------
  # DATABASES & INFRA
  # ------------------------------------------------------------------

  postgres:
    <<: *common
    image: ${POSTGRES_IMAGE}
    container_name: ${CONTAINER_PREFIX}_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - flowsdone-net
    mem_limit: ${POSTGRES_MEM_LIMIT}
    cpus: ${POSTGRES_CPUS}

  redis:
    <<: *common
    image: ${REDIS_IMAGE}
    container_name: ${CONTAINER_PREFIX}_redis
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - flowsdone-net
    mem_limit: ${REDIS_MEM_LIMIT}
    cpus: ${REDIS_CPUS}

  redis-insight:
    <<: *common
    image: ${REDISINSIGHT_IMAGE}
    container_name: ${CONTAINER_PREFIX}_redisinsight
    networks:
      - flowsdone-net
    ports:
      - "${REDISINSIGHT_PORT}:5540"
    environment:
      RI_APP_HOST: ${REDISINSIGHT_APP_HOST}
      RI_APP_PORT: 5540
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: ${REDISINSIGHT_MEM_LIMIT}
    cpus: ${REDISINSIGHT_CPUS}

  rabbitmq-scout:
    <<: *common
    image: ${RABBITSCOUT_IMAGE}
    container_name: ${CONTAINER_PREFIX}_rabbitmq_scout
    networks:
      - flowsdone-net
    ports:
      - "${RABBITMQ_SCOUT_PORT}:3000"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_MGMT_PORT}
      RABBITMQ_PROTOCOL: ${RABBITMQ_PROTOCOL}
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: ${RABBITSCOUT_MEM_LIMIT}
    cpus: ${RABBITSCOUT_CPUS}

  weaviate:
    <<: *common
    image: ${WEAVIATE_IMAGE}
    container_name: ${CONTAINER_PREFIX}_weaviate
    ports:
      - "${WEAVIATE_PORT}:8080"
      - "${WEAVIATE_GRPC_PORT}:50051"
    networks:
      - flowsdone-net
    environment:
      RAFT_BOOTSTRAP_EXPECT: ${WEAVIATE_RAFT_BOOTSTRAP_EXPECT}
      CLUSTER_HOSTNAME: ${WEAVIATE_CLUSTER_HOSTNAME}
      LOG_LEVEL: ${WEAVIATE_LOG_LEVEL}
      QUERY_DEFAULTS_LIMIT: ${WEAVIATE_QUERY_LIMIT}
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: ${WEAVIATE_ANON_ACCESS}
      AUTHENTICATION_APIKEY_ENABLED: ${WEAVIATE_AUTHENTICATION_APIKEY_ENABLED}
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_AUTHENTICATION_APIKEY_ALLOWED_KEY}
      AUTHENTICATION_APIKEY_USERS: ${WEAVIATE_AUTHENTICATION_APIKEY_USERS}
      PERSISTENCE_DATA_PATH: ${WEAVIATE_PERSISTENCE_DATA_PATH}
      DEFAULT_VECTORIZER_MODULE: ${WEAVIATE_VECTORIZER}
      ENABLE_MODULES: ${WEAVIATE_MODULES}
    volumes:
      - ./volumes/weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: ${WEAVIATE_MEM_LIMIT}
    cpus: ${WEAVIATE_CPUS}

  weaviate-gui:
    <<: *common
    build:
      context: ${WEAVIATE_GUI_BUILD_CONTEXT}
    container_name: ${CONTAINER_PREFIX}_weaviate_gui
    networks:
      - flowsdone-net
    ports:
      - "${WEAVIATE_GUI_PORT}:8501"
    environment:
      WEAVIATE_URL: ${WEAVIATE_URL}
      WEAVIATE_API_KEY: ${WEAVIATE_AUTHENTICATION_APIKEY_ALLOWED_KEY}
    depends_on:
      weaviate:
        condition: service_healthy
    mem_limit: ${WEAVIATE_GUI_MEM_LIMIT}
    cpus: ${WEAVIATE_GUI_CPUS}

  # ------------------------------------------------------------------
  # OBSERVABILIDAD — OpenTelemetry (logs de todos los contenedores + traces)
  # ------------------------------------------------------------------

  opensearch:
    <<: *common
    # profiles: [prod]
    image: ${OPENSEARCH_IMAGE}
    container_name: ${CONTAINER_PREFIX}_opensearch
    environment:
      cluster.name: ${OPENSEARCH_CLUSTER_NAME}
      node.name: ${OPENSEARCH_NODE_NAME}
      discovery.type: ${OPENSEARCH_DISCOVERY_TYPE}
      bootstrap.memory_lock: ${OPENSEARCH_BOOTSTRAP_MEMORY_LOCK}
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      plugins.security.disabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -k -sf -u ${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD} ${OPENSEARCH_HEALTH_URL} | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - flowsdone-net
    mem_limit: ${OPENSEARCH_MEM_LIMIT}
    cpus: ${OPENSEARCH_CPUS}

  opensearch-dashboards:
    <<: *common
    # profiles: [prod]
    image: ${OPENSEARCH_DASHBOARDS_IMAGE}
    container_name: ${CONTAINER_PREFIX}_opensearch_dashboards
    # opensearch_security.multitenancy.* no está en la whitelist de keys que
    # el entrypoint de la imagen convierte desde variables de entorno, así
    # que se pasa como flag: el entrypoint reenvía cualquier arg extra al
    # binario final. Sin esto, los saved objects (index patterns,
    # dashboards) quedan en el tenant "Private" del usuario que los creó
    # -invisible tanto en "Global" como en cualquier tenant custom-, aunque
    # la API confirme que existen.
    command: ["--opensearch_security.multitenancy.enabled=false"]
    environment:
      OPENSEARCH_HOSTS: ${OPENSEARCH_DASHBOARDS_HOSTS}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_SSL_VERIFICATIONMODE: none
      DISABLE_SECURITY_PLUGIN: "false"
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "${OPENSEARCH_DASH_PORT}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u ${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD} http://localhost:5601/api/status | grep -q '\"state\":\"green\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - flowsdone-net
    mem_limit: ${OPENSEARCH_DASH_MEM_LIMIT}
    cpus: ${OPENSEARCH_DASH_CPUS}

  otel-collector:
    <<: *common
    # profiles: [prod]
    image: ${OTEL_COLLECTOR_IMAGE}
    container_name: ${CONTAINER_PREFIX}_otel_collector
    user: "0"
    environment:
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "${OTEL_PORT_GRPC}:4317"
      - "${OTEL_PORT_HTTP}:4318"
    networks:
      - flowsdone-net
    mem_limit: ${OTEL_MEM_LIMIT}
    cpus: ${OTEL_CPUS}

  clickhouse:
    <<: *common
    image: ${CLICKHOUSE_IMAGE}
    container_name: ${CONTAINER_PREFIX}_clickhouse
    env_file: .env
    environment:
      # Contraseña del usuario de la plataforma (users.d/flowsdone_app.xml la
      # lee de aquí). Obligatoria: sin ella el usuario quedaría sin contraseña,
      # así que docker compose se niega a arrancar.
      CLICKHOUSE_APP_PASSWORD: ${CLICKHOUSE_APP_PASSWORD:?Falta CLICKHOUSE_APP_PASSWORD en .env (openssl rand -hex 24)}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./scripts/clickhouse/users.d/flowsdone_app.xml:/etc/clickhouse-server/users.d/flowsdone_app.xml:ro
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_TCP_PORT}:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flowsdone-net
    mem_limit: ${CLICKHOUSE_MEM_LIMIT}
    cpus: ${CLICKHOUSE_CPUS}

  minio:
    <<: *common
    image: ${MINIO_IMAGE}
    container_name: ${CONTAINER_PREFIX}_minio
    command: server /data --console-address ":9001"
    env_file: .env
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ./volumes/minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - flowsdone-net
    mem_limit: ${MINIO_MEM_LIMIT}
    cpus: ${MINIO_CPUS}

  kafka:
    <<: *common
    image: ${KAFKA_IMAGE}
    container_name: ${CONTAINER_PREFIX}_kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data   # ← cambiado de /tmp
    volumes:
      - ./volumes/kafka_data:/var/lib/kafka/data       # ← NUEVO
    networks:
      - flowsdone-net
    mem_limit: ${KAFKA_MEM_LIMIT}
    cpus: ${KAFKA_CPUS}

  rabbitmq:
    <<: *common
    image: ${RABBITMQ_IMAGE}
    container_name: ${CONTAINER_PREFIX}_rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - ./volumes/rabbitmq_data:/var/lib/rabbitmq     # ← named volume en vez de bind mount
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 30s
    networks:
      - flowsdone-net
    mem_limit: ${RABBITMQ_MEM_LIMIT}
    cpus: ${RABBITMQ_CPUS}

  # ------------------------------------------------------------------
  # LANGFUSE
  # ------------------------------------------------------------------

  langfuse-web:
    <<: *common
    image: ${LANGFUSE_IMAGE}
    container_name: ${CONTAINER_PREFIX}_langfuse
    depends_on: &langfuse-deps
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - ${LANGFUSE_PORT}:3000
    environment: &langfuse-env
      HOSTNAME: "0.0.0.0"                   # ← Next.js bind fix
      NODE_OPTIONS: "--max-old-space-size=2048"  # deja headroom bajo LANGFUSE_MEM_LIMIT

      # Auth
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}

      # Base de datos
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${LANGFUSE_DB}

      # ClickHouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # MinIO / S3
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${MINIO_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${MINIO_REGION}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${MINIO_BUCKET}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${MINIO_REGION}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}

      # Misc
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"

    networks:
      - flowsdone-net
    mem_limit: ${LANGFUSE_MEM_LIMIT}
    cpus: ${LANGFUSE_CPUS}

  langfuse-worker:
    <<: *common
    image: ${LANGFUSE_WORKER_IMAGE}
    container_name: ${CONTAINER_PREFIX}_langfuse_worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      langfuse-web:
        condition: service_started
    environment: *langfuse-env
    networks:
      - flowsdone-net
    mem_limit: ${LANGFUSE_WORKER_MEM_LIMIT}
    cpus: ${LANGFUSE_WORKER_CPUS}

  # ------------------------------------------------------------------
  # LANGFLOW
  # ------------------------------------------------------------------

  langflow:
    <<: *common
    build:
      context: .
      dockerfile: dockers/Dockerfile.langflow
    container_name: ${CONTAINER_PREFIX}_langflow
    # Solo loopback: el acceso remoto es por Traefik (agents.<dominio>) y, en
    # producción, hoy solo para el equipo de la plataforma. Publicar el 7860 en
    # todas las interfaces era una segunda puerta a la misma app.
    ports:
      - "127.0.0.1:${LANGFLOW_PORT}:7860"
    volumes:
      - ./volumes/langflow/components:/app/langflow/components
      - ./volumes/langflow/settings:/app/langflow/settings
    environment:
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_HOST: ${LANGFUSE_BASE_URL}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
      LANGFLOW_DATA_DIR: /app/langflow/data
      LANGFLOW_DATABASE_URL: ${LANGFLOW_DATABASE_URL}   # ← NUEVO
      LANGFLOW_COMPONENTS_PATH: /app/langflow/components
      LANGFLOW_LOG_LEVEL: ${LANGFLOW_LOG_LEVEL:-info}
      # Sin esto, Langflow genera una clave Fernet al azar dentro del
      # contenedor (~/.cache/langflow/secret_key, no montado a un volumen del
      # host) y la pierde en cada recreación - invalidando todos los Global
      # Variables tipo Credential guardados con la clave anterior
      # (cryptography.fernet.InvalidToken). Fija y estable entre deploys.
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY}
      # --- Acceso a la interfaz de Langflow ---------------------------------
      # Langflow 1.4 arranca con AUTO_LOGIN=true: quien abra la URL entra como
      # superusuario SIN contraseña (y un superusuario ejecuta Python arbitrario
      # en este contenedor, que recibe secretos de la plataforma). Se desactiva y
      # se exige una contraseña propia. Si la variable falta, docker compose se
      # niega a arrancar en vez de desplegar con la de por defecto (`langflow`).
      # OJO: el superusuario que YA existe conserva su contraseña anterior aunque
      # cambie esta variable; hay que cambiarla ANTES con
      # scripts/ops/langflow_set_superuser_password.sh (ver README, sección Langflow).
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-langflow}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:?Falta LANGFLOW_SUPERUSER_PASSWORD en .env (contraseña fuerte; ver README, sección Langflow)}
      # Un registro nuevo queda inactivo hasta que el superusuario lo active.
      LANGFLOW_NEW_USER_IS_ACTIVE: "false"
      # Sin la "Langflow Store": es un servicio externo (api.langflow.store)
      # abandonado, que pide su propia API key y hoy falla por certificado.
      # Con esto el editor ni la muestra ni la consulta.
      LANGFLOW_STORE: "false"
      # Default de la URL de Weaviate para components/weaviate_multitenant.py
      # (os.environ, nunca hardcodeado en el componente) - mismo patron que
      # GATEWAY_INTERNAL_URL mas abajo.
      WEAVIATE_URL: ${WEAVIATE_URL}
      # Para el agente de onboarding interno (tool provision_client):
      # llama de vuelta al admin API del gateway para crear tenant/
      # project/agent/channel_connection. Mismo patron que n8n usa para
      # llamar a Langflow (LANGFLOW_BASE_URL/LANGFLOW_API_KEY, seccion 13
      # del README) - la tool lee esto via os.environ, nunca hardcodeado
      # en el flow.
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL}
      GATEWAY_ADMIN_API_KEY: ${ADMIN_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy          # ← NUEVO
      langfuse-web:
        condition: service_started
    command: langflow run --host 0.0.0.0
    networks:
      - flowsdone-net
    mem_limit: ${LANGFLOW_MEM_LIMIT}
    cpus: ${LANGFLOW_CPUS}

  # ------------------------------------------------------------------
  # N8N — automatización / triggers. Los flujos de IA se orquestan en
  # Langflow; n8n llama a Langflow vía HTTP Request a LANGFLOW_BASE_URL,
  # no usa su nodo AI Agent.
  # ------------------------------------------------------------------

  n8n:
    <<: *common
    image: ${N8N_IMAGE}
    container_name: ${CONTAINER_PREFIX}_n8n
    ports:
      - "${N8N_PORT}:5678"
      - "${N8N_PORT_ALT}:5679"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      TINI_SUBREAPER: "1"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_STATEMENT_TIMEOUT: "0"
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENABLE_EXECUTE_COMMAND: ${N8N_ENABLE_EXECUTE_COMMAND}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      EXECUTIONS_DATA_PRUNE: ${N8N_EXECUTIONS_DATA_PRUNE}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL}
      # Permite usar $env.X en expresiones de nodos (Code, HTTP Request, etc.)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Para llamar a Langflow desde nodos HTTP Request / Code en vez del AI Agent node
      LANGFLOW_BASE_URL: ${LANGFLOW_BASE_URL}
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      # OJO: esta versión de n8n (2.33.3) lee N8N_OTEL_ENABLED /
      # N8N_OTEL_EXPORTER_OTLP_ENDPOINT — NO existen N8N_OTEL_TRACING_*
      # (quedaban de una versión/doc vieja de n8n y no hacían nada).
      N8N_OTEL_ENABLED: ${N8N_OTEL_TRACING_ENABLED}
      N8N_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      N8N_OTEL_EXPORTER_SERVICE_NAME: fd-n8n
    depends_on:
      postgres:
        condition: service_healthy
      langflow:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - flowsdone-net
    mem_limit: ${N8N_MEM_LIMIT}
    cpus: ${N8N_CPUS}

  # ------------------------------------------------------------------
  # API GATEWAY
  # ------------------------------------------------------------------

  api:
    <<: *common
    build:
      context: .
      dockerfile: dockers/Dockerfile.api
    container_name: ${CONTAINER_PREFIX}_gateway
    env_file: .env
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: fd-gateway
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./api_gateway:/app/api_gateway
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowsdone-net
    mem_limit: ${API_MEM_LIMIT}
    cpus: ${API_CPUS}

  # ------------------------------------------------------------------
  # PWA — consola web (React + Vite, servida por nginx)
  # ------------------------------------------------------------------
  # Los ${VAR:-default} evitan que el deploy falle en un VPS cuyo .env
  # todavía no tenga estas variables (mem_limit vacío rompe `compose up`).

  pwa:
    <<: *common
    build:
      context: ./flowsdone_pwa
      dockerfile: Dockerfile
      args:
        # http = backend real (default seguro). mock = cuentas de demo, solo maquetas locales.
        VITE_AUTH_MODE: ${PWA_AUTH_MODE:-http}
        VITE_API_BASE_URL: ${PWA_API_BASE_URL:-/api}
    container_name: ${CONTAINER_PREFIX}_pwa
    # Solo loopback por defecto: en producción el acceso público es por Traefik
    # (https://app.flowsdone.com); publicar el 80 del contenedor en todas las
    # interfaces expondría el login por http plano saltándose TLS. Para probar
    # desde otra máquina de la red local: PWA_BIND=0.0.0.0 en el .env.
    ports:
      - "${PWA_BIND:-127.0.0.1}:${PWA_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - flowsdone-net
    mem_limit: ${PWA_MEM_LIMIT:-128m}
    cpus: ${PWA_CPUS:-0.25}

  # ------------------------------------------------------------------
  # WORKERS — KAFKA
  # ------------------------------------------------------------------

  kafka_inbound_worker:
    <<: *common
    build:
      context: .
      dockerfile: dockers/Dockerfile.worker
    command: python -m workers.kafka.inbound.main
    env_file: .env
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: fd-kafka-inbound-worker
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      langflow:
        condition: service_started
    networks:
      - flowsdone-net
    mem_limit: ${KAFKA_INBOUND_WORKER_MEM_LIMIT}
    cpus: ${KAFKA_INBOUND_WORKER_CPUS}

  kafka_outbound_worker:
    <<: *common
    build:
      context: .
      dockerfile: dockers/Dockerfile.worker
    command: python -m workers.kafka.outbound.main
    env_file: .env
    environment:
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL}
      CALLBACK_HMAC_SECRET: ${CALLBACK_HMAC_SECRET}
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: fd-kafka-outbound-worker
    depends_on:
      kafka:
        condition: service_started
    networks:
      - flowsdone-net
    mem_limit: ${KAFKA_OUTBOUND_WORKER_MEM_LIMIT}
    cpus: ${KAFKA_OUTBOUND_WORKER_CPUS}

  # Voice channel: dedicated worker/topic, kept isolated from the text
  # channels' kafka_inbound_worker/kafka_outbound_worker pair so a
  # burst of calls never competes with them for capacity.
  kafka_voice_worker:
    <<: *common
    build:
      context: .
      dockerfile: dockers/Dockerfile.worker
    command: python -m workers.kafka.voice.main
    env_file: .env
    environment:
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL}
      CALLBACK_HMAC_SECRET: ${CALLBACK_HMAC_SECRET}
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: fd-kafka-voice-worker
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      langflow:
        condition: service_started
    networks:
      - flowsdone-net
    mem_limit: ${KAFKA_VOICE_WORKER_MEM_LIMIT}
    cpus: ${KAFKA_VOICE_WORKER_CPUS}

  # Conversations: archives every recorded message (topic
  # conversation.events) into ClickHouse and closes conversations idle
  # past CONVERSATION_INACTIVITY_SECONDS. ClickHouse's database/user/
  # tables are created by scripts/clickhouse/init-clickhouse.sh (run by
  # the deploy, before this worker starts).
  kafka_conversations_worker:
    <<: *common
    build:
      context: .
      dockerfile: dockers/Dockerfile.worker
    command: python -m workers.kafka.conversations.main
    env_file: .env
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: fd-kafka-conversations-worker
      CLICKHOUSE_URL: http://clickhouse:8123
    healthcheck:
      # The worker touches this file every 30s while its event loop runs.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/conversations-worker.heartbeat') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - flowsdone-net
    mem_limit: ${KAFKA_CONVERSATIONS_WORKER_MEM_LIMIT:-256m}
    cpus: ${KAFKA_CONVERSATIONS_WORKER_CPUS:-0.5}

  # Usage/billing periodic jobs: imports LLM token usage from Langfuse
  # into ClickHouse (attributed per conversation/tenant) and closes the
  # monthly usage statements. Stateless and idempotent - one replica.
  usage_worker:
    <<: *common
    build:
      context: .
      dockerfile: dockers/Dockerfile.worker
    command: python -m workers.usage.main
    env_file: .env
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: fd-usage-worker
      CLICKHOUSE_URL: http://clickhouse:8123
    healthcheck:
      # The worker touches this file every 30s while its event loop runs.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/usage-worker.heartbeat') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - flowsdone-net
    mem_limit: ${USAGE_WORKER_MEM_LIMIT:-256m}
    cpus: ${USAGE_WORKER_CPUS:-0.25}

  # ------------------------------------------------------------------
  # WORKERS — RABBITMQ
  # ------------------------------------------------------------------

  rabbitmq_inbound_worker:
    <<: *common
    build:
      context: .
      dockerfile: dockers/Dockerfile.worker
    command: python -m workers.rabbitmq.inbound.main
    env_file: .env
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: fd-rabbitmq-inbound-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      langflow:
        condition: service_started
    networks:
      - flowsdone-net
    mem_limit: ${RABBITMQ_INBOUND_WORKER_MEM_LIMIT}
    cpus: ${RABBITMQ_INBOUND_WORKER_CPUS}

  rabbitmq_outbound_worker:
    <<: *common
    build:
      context: .
      dockerfile: dockers/Dockerfile.worker
    command: python -m workers.rabbitmq.outbound.main
    env_file: .env
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: fd-rabbitmq-outbound-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - flowsdone-net
    mem_limit: ${RABBITMQ_OUTBOUND_WORKER_MEM_LIMIT}
    cpus: ${RABBITMQ_OUTBOUND_WORKER_CPUS}

  # ------------------------------------------------------------------
  # EVOLUTION API (WhatsApp)
  # ------------------------------------------------------------------

  evolution:
    <<: *common
    build:
      context: ./evolution-api
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX}_evolution
    ports:
      - "${EVOLUTION_PORT}:8080"
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL}
      N8N_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_DB}?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      PRISMA_MIGRATE_DISABLE_ADVISORY_LOCK: ${PRISMA_MIGRATE_DISABLE_ADVISORY_LOCK}
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URI: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672"
      WEBSOCKET_ENABLED: "true"
      WEBSOCKET_GLOBAL_EVENTS: "true"
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: fd-evolution
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - flowsdone-net
    mem_limit: ${EVOLUTION_MEM_LIMIT}
    cpus: ${EVOLUTION_CPUS}

  # ------------------------------------------------------------------
  # TRAEFIK — solo profile prod. Rutea por dominio usando el file
  # provider (traefik/dynamic.yml), no lee labels de Docker.
  # ------------------------------------------------------------------

  traefik:
    <<: *common
    profiles: [prod]
    image: ${TRAEFIK_IMAGE}
    container_name: ${CONTAINER_PREFIX}_traefik
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.preferredchain=ISRG Root X1"
      - "--accesslog=true"
      - "--log.level=${TRAEFIK_LOG_LEVEL}"
    ports:
      - "${TRAEFIK_HTTP_PORT}:80"
      - "${TRAEFIK_HTTPS_PORT}:443"
    volumes:
      # Se monta la CARPETA, no el archivo suelto: `git pull` reemplaza los archivos
      # por otros nuevos (otro inodo) y un bind mount de un solo archivo sigue viendo
      # el viejo, así que Traefik nunca recargaba las rutas nuevas. Con la carpeta,
      # el watcher las detecta solo.
      - ./traefik:/etc/traefik/dynamic:ro
      - ./volumes/letsencrypt:/letsencrypt
    networks:
      - flowsdone-net
    mem_limit: ${TRAEFIK_MEM_LIMIT}
    cpus: ${TRAEFIK_CPUS}