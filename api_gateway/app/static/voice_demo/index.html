<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Flowsdone Voice Demo Softphone</title>
  <link rel="stylesheet" href="softphone.css?v=20260811" />
</head>
<body>
  <main class="demo-page">
    <section class="demo-card">
      <h1>Voicebot - Softphone de prueba</h1>
      <p>
        Llama por WebRTC (Twilio Voice SDK) directo al mismo webhook
        <code>/webhooks/voice</code> que usa una llamada telefónica real -
        sin gastar minutos ni necesitar un teléfono.
      </p>

      <div id="sp-status" class="sp-status">
        <span class="sp-status-dot"></span>
        <span id="sp-status-text">Inicializando...</span>
      </div>

      <button id="sp-call-btn" class="sp-call-btn" disabled>Conectando...</button>

      <div id="sp-log" class="sp-log"></div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);

    window.VoiceDemoConfig = {
      // Número Twilio registrado como ChannelConnection(channel_type="voice").
      toNumber: params.get("to") || "+16014944500",
      identity: params.get("identity") || ("demo-" + Math.random().toString(36).slice(2, 8)),
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2/dist/twilio.min.js"></script>
  <script src="softphone.js?v=20260811"></script>
</body>
</html>
