<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>ZavarceCloud AI Webchat</title>
  <link rel="stylesheet" href="agent-chat-widget.css?v=20260716" />
</head>
<body>
  <main class="demo-page">
    <section class="demo-card">
      <h1>ZavarceCloud AI Webchat</h1>
      <p>El WebSocket se crea al hacer click en el launcher.</p>
      <p>Los mensajes del usuario viajan por WebSocket al gateway.</p>
      <p>El gateway reenvía por Kafka al workflow.</p>
    </section>
  </main>

  <script>

    const conversationId =
        localStorage.getItem("conversation_id") ||
        crypto.randomUUID();

    localStorage.setItem("conversation_id", conversationId);

    // Casos de uso básicos de prueba (ver ?caso=langflow o ?caso=n8n en la URL):
    //   - langflow (default): transport=kafka -> kafka_inbound_worker -> Langflow ("Basic Prompting")
    //   - n8n: transport=rabbitmq -> workflow de n8n "Flowsdone - Caso de uso basico (RabbitMQ)"
    const params = new URLSearchParams(location.search);
    const caso = params.get("caso") || "langflow";

    const CASES = {
      langflow: { workflowId: "658e4dfa-ade3-4085-82bd-297b4a987d2d", transport: "kafka" },
      n8n: { workflowId: "n8n-demo-workflow", transport: "rabbitmq" },
    };
    const selected = CASES[caso] || CASES.langflow;

    window.AgentChatConfig = {
      wsUrl: (location.protocol === 'https:' ? 'wss://' : 'ws://')
           + location.host
           + '/ws',

      workflowId: params.get("workflow_id") || selected.workflowId,
      conversationId: conversationId,
      userId: "anonymous",

      transport: params.get("transport") || selected.transport,

      title: 'ZavarceCloud AI',
      initialMessage: 'Hi! How can I help you today?',
      inputPlaceholder: 'Type your message...',
      waitingMessage: 'Processing your request',

      launcherColor: '#4F46E5',
      launcherIconColor: '#ffffff',
      launcherIconAccentColor: '#111827',
      sendButtonColor: '#10B981',

      width: '420px',
      height: '680px',
      autoOpen: false
    };
  </script>

  <!-- El widget DESPUÉS del config, sin defer -->
  <script src="agent-chat-widget.js"></script>
</body>
</html>
