[project]
name = "api-gateway-flowsdone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.6.2",
    "aiokafka>=0.14.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.1.0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Sin esto, setuptools intenta adivinar qué carpeta del repo es el
# paquete instalable y encuentra varias candidatas en la raíz
# (dockers/, postman/, workers/, volumes/, api_gateway/) - falla con
# "Multiple top-level packages discovered in a flat-layout". El
# Dockerfile no lo sufre porque en ese build context solo existe
# api_gateway/ + pyproject.toml (dockers/postman/workers/... no se
# copian a la imagen), pero un checkout completo del repo (como el
# runner de GitHub Actions, o instalar en local desde la raíz) sí ve
# todas las carpetas y necesita que se lo digamos explícito.
[tool.setuptools.packages.find]
include = ["api_gateway*"]

[tool.pytest.ini_options]
testpaths = ["api_gateway/tests"]

[tool.coverage.run]
source = ["api_gateway/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
# Piso inicial, no aspiracional: hoy application/ y buena parte de
# adapters/ están cubiertos, pero admin/ (routers CRUD), db/
# (repositorios SQLAlchemy), infrastructure/ y main.py todavía no
# tienen tests (ver README sección 17) y arrastran el numero global.
# 65 da margen bajo el ~69% actual para que el gate no rompa por
# fluctuaciones menores; conviene subirlo a medida que se sume
# cobertura en esas capas, no bajarlo para acomodar código nuevo sin
# tests.
fail_under = 65
