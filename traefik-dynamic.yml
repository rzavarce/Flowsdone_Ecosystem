# Rutas estáticas de Traefik — file provider
# Actualizá los dominios acá si cambian (no toman variables de .env)
# Traefik las recarga solo gracias a --providers.file.watch=true

http:
  middlewares:
    webchat-static:
      replacePathRegex:
        regex: "^/(.*)"
        replacement: "/static/webchat/$1"

    flowsdone-static:
      replacePathRegex:
        regex: "^/(.*)"
        replacement: "/static/flowsdone/$1"

    fibralan-static:
      replacePathRegex:
        regex: "^/(.*)"
        replacement: "/static/fibralan/$1"

  routers:
    n8n:
      rule: "Host(`auto.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: n8n-svc

    langfuse:
      rule: "Host(`langfuse.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: langfuse-svc

    langflow:
      rule: "Host(`agents.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: langflow-svc

    evolution:
      rule: "Host(`evo.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: evolution-svc

    # Los routers *-ws van SIN el middleware de reescritura de path: si no,
    # replacePathRegex convierte /ws en /static/<sitio>/ws y el websocket
    # del chat nunca llega al gateway. Priority alta para que Traefik los
    # elija sobre el router Host-only de abajo (que sí tiene el rewrite).
    webchat-ws:
      rule: "Host(`chat.flowsdone.com`) && Path(`/ws`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc
      priority: 100

    webchat:
      rule: "Host(`chat.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc
      middlewares:
        - webchat-static

    flowsdone-ws:
      rule: "(Host(`flowsdone.com`) || Host(`www.flowsdone.com`)) && Path(`/ws`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc
      priority: 100

    flowsdone:
      rule: "Host(`flowsdone.com`) || Host(`www.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc
      middlewares:
        - flowsdone-static

    minio:
      rule: "Host(`buckets.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: minio-svc

    redisinsight:
      rule: "Host(`cache.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: redisinsight-svc

    rabbitui:
      rule: "Host(`broker.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: rabbitui-svc

    weaviate:
      rule: "Host(`vector.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: weaviate-svc

    logs:
      rule: "Host(`logs.flowsdone.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: logs-svc

    fibralan-ws:
      rule: "(Host(`fibralansecurity.com`) || Host(`www.fibralansecurity.com`)) && Path(`/ws`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc
      priority: 100

    fibralan:
      rule: "Host(`fibralansecurity.com`) || Host(`www.fibralansecurity.com`)"
      entrypoints: [websecure]
      tls:
        certresolver: myresolver
      service: webchat-svc
      middlewares:
        - fibralan-static

  services:
    n8n-svc:
      loadBalancer:
        servers:
          - url: "http://n8n:5678"

    langfuse-svc:
      loadBalancer:
        servers:
          - url: "http://langfuse-web:3000"

    langflow-svc:
      loadBalancer:
        servers:
          - url: "http://langflow:7860"

    evolution-svc:
      loadBalancer:
        servers:
          - url: "http://evolution:8080"

    # El webchat se sirve como estático desde el propio gateway (api),
    # no hay un servicio webchat-gateway separado en este proyecto.
    webchat-svc:
      loadBalancer:
        servers:
          - url: "http://api:8000"

    minio-svc:
      loadBalancer:
        servers:
          - url: "http://minio:9001"

    redisinsight-svc:
      loadBalancer:
        servers:
          - url: "http://redis-insight:5540"

    rabbitui-svc:
      loadBalancer:
        servers:
          - url: "http://rabbitmq-scout:3000"

    weaviate-svc:
      loadBalancer:
        servers:
          - url: "http://weaviate-gui:8501"

    logs-svc:
      loadBalancer:
        servers:
          - url: "http://opensearch-dashboards:5601"
