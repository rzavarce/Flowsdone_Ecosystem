extensions:
  basicauth/opensearch:
    client_auth:
      username: admin
      password: ${OPENSEARCH_PASSWORD}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Logs de TODOS los contenedores del host (json-file driver de Docker),
  # incluida la infra que no habla OTLP nativo (postgres, redis, rabbitmq, ...).
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*.log
    start_at: beginning
    include_file_path: true
    operators:
      # Cada línea del driver json-file de Docker es un JSON:
      # {"log":"...","stream":"stdout|stderr","time":"...","attrs":{"com.docker.compose.service":"..."}}
      # El campo "attrs" existe porque docker-compose.yml define
      # logging.options.labels: com.docker.compose.service en el anchor &common.
      - type: json_parser
        parse_to: attributes
        on_error: send
      - type: move
        from: attributes.log
        to: body
        if: attributes.log != nil

      # Promovemos el nombre del servicio a resource attribute: lo usa el
      # exporter de OpenSearch para enrutar cada log al índice de su servicio.
      - type: move
        from: attributes.attrs["com.docker.compose.service"]
        to: resource["service.name"]
        if: attributes.attrs != nil && attributes.attrs["com.docker.compose.service"] != nil
      - type: remove
        field: attributes.attrs
        if: attributes.attrs != nil

      # Severidad base según el stream (stdout/stderr). Es solo un fallback:
      # si más abajo logramos parsear el nivel real del log, lo pisa.
      - type: severity_parser
        parse_from: attributes.stream
        if: attributes.stream != nil
        mapping:
          error: stderr
          info: stdout

      # La mayoría de nuestros servicios loguean JSON estructurado. Si el body
      # parsea como JSON, buscamos el nivel real ahí (Python logging usa
      # "levelname", la mayoría del resto usa "level").
      - type: json_parser
        parse_from: body
        parse_to: attributes.body_json
        on_error: send_quiet
      - type: severity_parser
        parse_from: attributes.body_json.levelname
        if: attributes.body_json != nil && attributes.body_json.levelname != nil
        mapping:
          debug: DEBUG
          info: INFO
          warn: WARNING
          error: ERROR
          fatal: [CRITICAL, FATAL]
      - type: severity_parser
        parse_from: attributes.body_json.level
        if: attributes.body_json != nil && attributes.body_json.level != nil
        mapping:
          debug: [debug, DEBUG]
          info: [info, INFO]
          warn: [warn, warning, WARN, WARNING]
          error: [error, ERROR]
          fatal: [critical, CRITICAL, fatal, FATAL]

      # Traefik loguea texto plano (access log tipo CLF), no JSON - el
      # regex_parser genérico de más abajo (busca CRITICAL/ERROR/WARN como
      # palabra suelta) le pegaba a esas palabras dentro del PATH de la URL
      # (ej. ".../errors-critical-timeline" o ".../error.js"), marcando
      # peticiones 200 OK como "critical"/"error". Para traefik usamos el
      # código HTTP real, que sí refleja si la petición fue un problema.
      - type: regex_parser
        parse_from: body
        parse_to: attributes.traefik_status
        if: resource["service.name"] == "traefik" && attributes.body_json == nil
        regex: '"\s+(?P<status>\d{3})\s+\d+\s'
        on_error: send_quiet
      - type: severity_parser
        parse_from: attributes.traefik_status.status
        if: attributes.traefik_status != nil && attributes.traefik_status.status != nil
        mapping:
          info: 2xx
          info2: 3xx
          warn: 4xx
          error: 5xx

      # Si el body no es JSON y no es un access log de traefik ya
      # clasificado arriba (nginx, uvicorn, etc.), buscamos la palabra de
      # nivel en el texto plano.
      - type: regex_parser
        parse_from: body
        parse_to: attributes.plain_level
        if: attributes.body_json == nil && resource["service.name"] != "traefik"
        regex: '(?i)\b(?P<level>CRITICAL|FATAL|ERROR|WARN(?:ING)?|INFO|DEBUG)\b'
        on_error: send_quiet
      - type: severity_parser
        parse_from: attributes.plain_level.level
        if: attributes.plain_level != nil && attributes.plain_level.level != nil
        mapping:
          debug: DEBUG
          info: INFO
          warn: [WARN, WARNING]
          error: ERROR
          fatal: [CRITICAL, FATAL]

      - type: remove
        field: attributes.body_json
        if: attributes.body_json != nil
      - type: remove
        field: attributes.plain_level
        if: attributes.plain_level != nil
      - type: remove
        field: attributes.traefik_status
        if: attributes.traefik_status != nil

      - type: time_parser
        parse_from: attributes.time
        layout_type: gotime
        layout: "2006-01-02T15:04:05.999999999Z"
        if: attributes.time != nil
      - type: remove
        field: attributes.time
        if: attributes.time != nil
      - type: remove
        field: attributes.stream
        if: attributes.stream != nil
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        if: attributes["log.file.path"] != nil
        regex: '^/var/lib/docker/containers/(?P<container_id>[0-9a-f]+)/'

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  resource/docker:
    attributes:
      - key: source
        value: docker
        action: upsert

exporters:
  opensearch:
    http:
      endpoint: https://opensearch:9200
      tls:
        insecure_skip_verify: true
      auth:
        authenticator: basicauth/opensearch
    # Un índice por servicio del compose (resource["service.name"], ver
    # filelog/docker). Si algún log llega sin la label (no debería, la label
    # se setea globalmente en &common), cae en logs-unknown-service.
    logs_index: "logs-%{service.name}"
    logs_index_fallback: "unknown-service"
    mapping:
      mode: ss4o
    timeout: 10s

service:
  extensions: [basicauth/opensearch]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch]

    logs:
      receivers: [otlp, filelog/docker]
      processors: [batch, resource/docker]
      exporters: [opensearch]
