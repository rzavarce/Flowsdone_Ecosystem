extensions:
  basicauth/opensearch:
    client_auth:
      username: admin
      password: ${OPENSEARCH_PASSWORD}

  # Langfuse ingiere trazas vía su endpoint OTLP público, autenticado con
  # Basic Auth: username = public key, password = secret key del proyecto.
  basicauth/langfuse:
    client_auth:
      username: ${LANGFUSE_PUBLIC_KEY}
      password: ${LANGFUSE_SECRET_KEY}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Logs de TODOS los contenedores del host (json-file driver de Docker),
  # incluida la infra que no habla OTLP nativo (postgres, redis, rabbitmq, ...).
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*.log
    start_at: beginning
    include_file_path: true
    operators:
      # Cada línea del driver json-file de Docker es un JSON: {"log":"...","stream":"stdout|stderr","time":"..."}
      - type: json_parser
        parse_to: attributes
        on_error: send
      - type: move
        from: attributes.log
        to: body
        if: attributes.log != nil
      - type: severity_parser
        parse_from: attributes.stream
        if: attributes.stream != nil
        mapping:
          error: stderr
          info: stdout
      - type: time_parser
        parse_from: attributes.time
        layout_type: gotime
        layout: "2006-01-02T15:04:05.999999999Z"
        if: attributes.time != nil
      - type: remove
        field: attributes.time
        if: attributes.time != nil
      - type: remove
        field: attributes.stream
        if: attributes.stream != nil
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        if: attributes["log.file.path"] != nil
        regex: '^/var/lib/docker/containers/(?P<container_id>[0-9a-f]+)/'

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  resource/docker:
    attributes:
      - key: source
        value: docker
        action: upsert

exporters:
  opensearch:
    http:
      endpoint: https://opensearch:9200
      tls:
        insecure_skip_verify: true
      auth:
        authenticator: basicauth/opensearch
    timeout: 10s

  # Trazas de cualquier servicio instrumentado con OTLP (api_gateway, workers,
  # n8n vía N8N_OTEL_TRACING_ENABLED) también se reenvían a Langfuse.
  otlphttp/langfuse:
    traces_endpoint: http://langfuse-web:3000/api/public/otel/v1/traces
    auth:
      authenticator: basicauth/langfuse

service:
  extensions: [basicauth/opensearch, basicauth/langfuse]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch, otlphttp/langfuse]

    logs:
      receivers: [otlp, filelog/docker]
      processors: [batch, resource/docker]
      exporters: [opensearch]
