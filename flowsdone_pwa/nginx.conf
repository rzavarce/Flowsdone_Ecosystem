server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Resolver de Docker: el upstream `api` se resuelve al momento de usarlo,
    # no al arrancar nginx (si el gateway aún no está arriba, nginx igual inicia).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # IP real del cliente. Delante de este nginx está Traefik (red interna de
    # Docker, rangos privados): solo de esos orígenes se confía en X-Forwarded-For.
    # Sin esto todos los usuarios llegarían al gateway con la IP del proxy y el
    # límite de intentos por IP los bloquearía a todos a la vez.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # API del gateway bajo el mismo origen que la PWA (la cookie de sesión es
    # httpOnly + SameSite=Lax y no hay CORS). Lista blanca: solo se expone lo que
    # la consola usa; al sumar endpoints, agregar su prefijo acá. Se quita /api.
    location ^~ /api/auth/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se sobrescribe (no se acumula) para que un cliente no pueda inyectar la suya.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    # API de administración: /api/admin/<recurso>/... -> /internal/admin/<recurso>/...
    # Lista blanca por recurso (solo lo que la consola usa hoy; sumar acá `users`,
    # `workflows`… cuando tengan pantalla). La autorización real (rol + tenant) la
    # impone el gateway en cada petición; esto solo evita exponer de más.
    # Regex a propósito: gana sobre el prefijo genérico `/api/` de abajo.
    location ~ ^/api/admin/(?:tenants|projects|agents|channel-connections|channel-apps|langflow|users|conversations|plans|cost-rates)(?:/|$) {
        set $api_upstream http://api:8000;
        rewrite ^/api/admin/(.*)$ /internal/admin/$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 64k;
        proxy_read_timeout 60s;
    }

    # Autoservicio: datos del usuario logueado sobre sí mismo (nunca pasa por
    # POLICY/admin API - ver adapters/inbound/http/me.py). Mismo patrón que /api/auth/.
    location ^~ /api/me/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    # Cualquier otra ruta /api/* NO se proxyea (evita exponer webhooks, admin, docs…).
    location /api/ {
        default_type application/json;
        return 404 '{"detail":"not found"}';
    }

    # Healthcheck del contenedor (docker-compose.yml).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets con hash en el nombre: inmutables, cache largo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El service worker, su registro y el manifest NO deben cachearse: si el
    # navegador conserva un sw.js viejo, la PWA nunca se actualiza.
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        # nginx no trae el tipo de .webmanifest: sin esto sale octet-stream.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del cliente cae en index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
